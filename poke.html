<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-4 text-center">

<div class="card mx-auto p-4 shadow" style="max-width: 400px;">
    <h1 class="h4 mb-3">Buscar Pokémon</h1>

    <div class="input-group mb-3">
      <input type="text" id="pokemon" class="form-control" placeholder="Digite o nome ou ID">
      <button class="btn btn-primary" onclick="buscarPokemon()">Buscar</button>
    </div>

    <!-- Informações principais -->
    <div class="mt-3">
      <h2 id="nome" class="h5 text-capitalize"></h2>
      <img id="imagem" src="" alt="" class="img-fluid my-2" style="max-height: 200px;">
    </div>

    <div class="mb-3">
      <span id="tipo" class="badge bg-secondary me-1 text-capitalize"></span>
      <span id="altura" class="badge bg-secondary me-1"></span>
      <span id="peso" class="badge bg-secondary"></span>
    </div>

  <!-- Barra de HP -->
  <div class="mb-2 text-start">
    <div class="d-flex justify-content-between">
      <span>HP</span>
      <span id="hp-val">0</span>
    </div>
    <div class="progress" role="progressbar" aria-label="HP">
      <div class="progress-bar bg-success" id="hp-bar" style="width: 0%"></div>
    </div>
  </div>  

  <!-- Barra de Ataque -->
  <div class="mb-2 text-start">
    <div class="d-flex justify-content-between">
      <span>Ataque</span>
      <span id="atk-val">0</span>
    </div>
    <div class="progress" role="progressbar" aria-label="Ataque">
      <div class="progress-bar bg-info" id="atk-bar" style="width: 0%"></div>
    </div>
  </div>  

  <!-- Barra de Defesa -->
  <div class="mb-2 text-start">
    <div class="d-flex justify-content-between">
      <span>Defesa</span>
      <span id="def-val">0</span>
    </div>
    <div class="progress" role="progressbar" aria-label="Defesa">
      <div class="progress-bar bg-warning" id="def-bar" style="width: 0%"></div>
    </div>
  </div>  

  <!-- Barra de Velocidade -->
  <div class="mb-2 text-start">
    <div class="d-flex justify-content-between">
      <span>Velocidade</span>
      <span id="spd-val">0</span>
    </div>
    <div class="progress" role="progressbar" aria-label="Velocidade">
      <div class="progress-bar bg-danger" id="spd-bar" style="width: 0%"></div>
    </div>
  </div> 

</div>   

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/poke.js"></script>
</body>
</html>
