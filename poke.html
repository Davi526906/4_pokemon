<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light p-4 text-center">

  <div class="card mx-auto p-4 shadow" style="max-width: 400px;">
    <h1 class="h4 mb-3">Buscar Pokémon</h1>

    <div class="input-group mb-3">
      <input type="text" id="pokemon" class="form-control" placeholder="Digite o nome">
      <button class="btn btn-primary" onclick="buscarPokemon()">Buscar</button>
    </div>

    <!-- Elementos adicionados que faltavam no HTML -->
    <div class="mt-3">
      <h2 id="nome" class="h5 text-capitalize"></h2>
      <img id="imagem" src="" alt="" class="img-fluid my-2" style="max-height: 200px;">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
